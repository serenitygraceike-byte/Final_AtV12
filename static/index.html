<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEO Agent</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #e0e0e0;
        }
        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px;
            max-width: 700px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        h1 {
            text-align: center;
            margin-bottom: 8px;
            font-size: 28px;
            color: #00d2ff;
        }
        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
        input[type="url"] {
            flex: 1;
            padding: 14px 18px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.07);
            color: #fff;
            font-size: 15px;
            outline: none;
        }
        input[type="url"]:focus { border-color: #7b2ff7; }
        input[type="url"]::placeholder { color: #666; }
        button {
            padding: 14px 28px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #7b2ff7, #00d2ff);
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        .results { margin-top: 20px; }
        .result-item {
            display: flex;
            align-items: flex-start;
            gap: 14px;
            padding: 16px;
            margin-bottom: 10px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
        }
        .result-number {
            flex-shrink: 0;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #7b2ff7, #00d2ff);
            border-radius: 50%;
            font-weight: 700;
            font-size: 14px;
            color: #fff;
        }
        .result-text { font-size: 15px; line-height: 1.5; padding-top: 4px; }
        .error {
            padding: 16px;
            background: rgba(255, 70, 70, 0.1);
            border: 1px solid rgba(255, 70, 70, 0.3);
            border-radius: 12px;
            color: #ff6b6b;
            font-size: 14px;
            margin-top: 10px;
        }
        .loading { text-align: center; padding: 30px; color: #888; }
        .spinner {
            width: 40px;
            height: 40px;
            margin: 0 auto 15px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: #7b2ff7;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .copy-btn {
            margin-top: 15px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            font-size: 13px;
            padding: 10px 20px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>SEO Agent</h1>
        <p class="subtitle">Вставьте URL статьи - получите 5 цепляющих заголовков</p>
        <form id="seoForm" class="input-group">
            <input type="url" id="urlInput" placeholder="https://example.com/article" required>
            <button type="submit" id="submitBtn">Сгенерировать</button>
        </form>
        <div id="results" class="results"></div>
        <button class="copy-btn" id="copyBtn">Копировать все заголовки</button>
    </div>
    <script>
        const form = document.getElementById('seoForm');
        const urlInput = document.getElementById('urlInput');
        const submitBtn = document.getElementById('submitBtn');
        const resultsDiv = document.getElementById('results');
        const copyBtn = document.getElementById('copyBtn');
        let currentTitles = [];
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const url = urlInput.value.trim();
            if (!url) return;
            submitBtn.disabled = true;
            submitBtn.textContent = 'Генерация...';
            resultsDiv.innerHTML = '<div class="loading"><div class="spinner"></div><p>Анализируем статью...</p></div>';
            copyBtn.style.display = 'none';
            currentTitles = [];
            try {
                const response = await fetch('/seo/generate-titles', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url }),
                });
                const data = await response.json();
                if (data.success && data.titles.length > 0) {
                    currentTitles = data.titles;
                    resultsDiv.innerHTML = data.titles.map((title, i) =>
                        '<div class="result-item">' +
                        '<div class="result-number">' + (i + 1) + '</div>' +
                        '<div class="result-text">' + escapeHtml(title) + '</div>' +
                        '</div>'
                    ).join('');
                    copyBtn.style.display = 'block';
                } else {
                    resultsDiv.innerHTML = '<div class="error">Ошибка: ' + (data.error || 'Не удалось сгенерировать заголовки') + '</div>';
                }
            } catch (error) {
                resultsDiv.innerHTML = '<div class="error">Ошибка соединения с сервером</div>';
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Сгенерировать';
            }
        });
        copyBtn.addEventListener('click', () => {
            if (currentTitles.length === 0) return;
            const text = currentTitles.join('\n');
            navigator.clipboard.writeText(text).then(() => {
                copyBtn.textContent = 'Скопировано!';
                setTimeout(() => { copyBtn.textContent = 'Копировать все заголовки'; }, 2000);
            });
        });
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
